<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FigAnzi">
<title>FigAnzi</title>
<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📐</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');

:root{
  --bg:#f5f3ef;
  --surface:#ffffff;
  --surface2:#f0ede8;
  --border:#e2ddd6;
  --text:#1a1714;
  --text2:#6b6560;
  --text3:#a09a93;
  --red:#c0392b;
  --red-light:#fdf0ef;
  --red-mid:#f5c6c2;
  --green:#1a6b4a;
  --green-light:#eef7f2;
  --green-mid:#a8d5be;
  --amber:#8a5a00;
  --amber-light:#fef8e7;
  --blue:#1a3a6b;
  --blue-light:#eef2fa;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overscroll-behavior:none}

.app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg)}
.header{background:var(--text);padding:env(safe-area-inset-top,16px) 20px 14px;flex-shrink:0}
.header-inner{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.logo{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;letter-spacing:-.3px}
.logo span{color:#e87060}
.header-date{font-size:11px;color:rgba(255,255,255,.5);font-weight:400}
.header-right{text-align:right}
.header-mes{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}

.sync-dot{width:7px;height:7px;border-radius:50%;background:#4caf50;display:inline-block;margin-left:6px;vertical-align:middle;transition:background .3s}
.sync-dot.syncing{background:#ff9800;animation:pulse .8s infinite}
.sync-dot.error{background:#f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.pane{display:none;padding:16px}
.pane.active{display:block}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 env(safe-area-inset-bottom,8px);z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;color:var(--text3);cursor:pointer;padding:6px 2px;letter-spacing:.3px;text-transform:uppercase}
.nav-btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.nav-btn.active{color:var(--red)}
.nav-btn.active svg{transform:scale(1.1)}

.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--border)}
.card-sm{background:var(--surface);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;border:1px solid var(--border)}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--border)}
.stat-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.stat-num{font-size:24px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.stat-num.red{color:var(--red)}
.stat-num.green{color:var(--green)}

.sec-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px}

.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:.2px}
.badge.pend{background:var(--amber-light);color:var(--amber)}
.badge.conf{background:var(--blue-light);color:var(--blue)}
.badge.ent{background:var(--green-light);color:var(--green)}
.badge.canc{background:#f5f0ef;color:var(--text3)}
.badge.pago-ok{background:var(--green-light);color:var(--green)}
.badge.pago-no{background:var(--red-light);color:var(--red)}
.badge.pago-parc{background:var(--amber-light);color:var(--amber)}

.cliente-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;transition:background .15s}
.cliente-card:active{background:var(--surface2)}
.cliente-avatar{width:40px;height:40px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.cliente-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.cliente-info h3{font-size:15px;font-weight:600;color:var(--text)}
.cliente-info p{font-size:12px;color:var(--text2);margin-top:1px}
.cliente-meta{display:flex;gap:6px;flex-wrap:wrap}
.money-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.money-pill{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.mp-total{background:var(--blue-light);color:var(--blue)}
.mp-ab{background:var(--amber-light);color:var(--amber)}
.mp-saldo{background:var(--red-light);color:var(--red)}
.mp-ok{background:var(--green-light);color:var(--green)}

.form-section{margin-bottom:14px}
.form-section label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--text)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-main{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--text);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.2px}
.btn-outline{padding:8px 14px;border-radius:var(--radius-sm);background:transparent;color:var(--text);border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-red{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-green{background:var(--green);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-row{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;font-size:13px;background:var(--surface)}
.chk input{width:15px;height:15px;accent-color:var(--red);cursor:pointer;flex-shrink:0}

.tipo-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tipo-btn{padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s}
.tipo-btn.sel{background:var(--text);color:#fff;border-color:var(--text)}

.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.filt{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.filt.active{background:var(--text);color:#fff;border-color:var(--text)}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header h2{font-family:'DM Serif Display',serif;font-size:20px}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.cal-day-name{font-size:9px;font-weight:600;color:var(--text3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{min-height:36px;border-radius:6px;padding:4px 2px;text-align:center;cursor:pointer;position:relative;font-size:12px;color:var(--text2)}
.cal-day.has-event{color:var(--text);font-weight:600}
.cal-day.today{background:var(--text);color:#fff;border-radius:6px}
.cal-day.today .dot{background:#fff!important}
.cal-day.other-month{color:var(--text3);opacity:.4}
.cal-day.selected{background:var(--red-light);color:var(--red);font-weight:600}
.dot{width:4px;height:4px;border-radius:50%;background:var(--red);margin:2px auto 0}
.cal-events{margin-top:4px}

.perfil-back{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text2);font-weight:500;flex-shrink:0;margin-right:12px}
.info-val{color:var(--text);text-align:right;word-break:break-word}

.aviso{background:var(--green-light);border:1px solid var(--green-mid);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px}
.aviso strong{font-size:13px;font-weight:600;color:var(--green);display:block;margin-bottom:3px}
.aviso p{font-size:12px;color:var(--green);white-space:pre-line;line-height:1.5}

.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:16px}
.loading-overlay.hidden{display:none}
.loading-logo{font-family:'DM Serif Display',serif;font-size:32px;color:var(--text)}
.loading-logo span{color:#e87060}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:12px;color:var(--text3)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:16px}

.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty p{font-size:14px}

@media print{
  .app,.nav,.header{display:none!important}
  #pdf-preview{display:block!important}
}
#pdf-preview{display:none;padding:20px;font-family:'DM Sans',sans-serif;color:#1a1714;max-width:800px;margin:0 auto}
#pdf-preview .pdf-logo{font-family:serif;font-size:28px;font-weight:700;margin-bottom:4px}
#pdf-preview .pdf-logo span{color:#c0392b}
#pdf-preview table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
#pdf-preview td,#pdf-preview th{border:1px solid #ddd;padding:7px 10px}
#pdf-preview th{background:#f5f3ef;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
#pdf-preview .pdf-section{margin-top:20px}
#pdf-preview .pdf-section h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#6b6560;margin-bottom:8px}
#pdf-preview .total-row td{font-weight:700;background:#f5f3ef}
#pdf-preview .disclaimer{font-size:10px;color:#999;margin-top:20px;text-align:center;font-style:italic}
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-logo"><span>Fig</span>Anzi.</div>
  <div class="spinner"></div>
  <div class="loading-txt">Conectando con Supabase…</div>
</div>

<div class="app">
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="logo"><span>Fig</span>Anzi. <span class="sync-dot" id="sync-dot"></span></div>
        <div class="header-date" id="h-fecha"></div>
      </div>
      <div class="header-right">
        <div class="header-mes" id="h-mes"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="pane active" id="p-hoy">
      <div id="aviso-hoy" class="aviso" style="display:none"><strong>☀️ Buenos días — agenda de hoy</strong><p id="aviso-txt"></p></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Citas hoy</div><div class="stat-num" id="s-citas">0</div></div>
        <div class="stat-card"><div class="stat-label">Entregas hoy</div><div class="stat-num" id="s-ent">0</div></div>
        <div class="stat-card"><div class="stat-label">Generado mes</div><div class="stat-num green" id="s-mes">$0</div></div>
        <div class="stat-card"><div class="stat-label">Por cobrar</div><div class="stat-num red" id="s-cobrar">$0</div></div>
      </div>
      <div class="sec-title">Agenda de hoy</div>
      <div id="lista-hoy"></div>
      <div class="sec-title">Próximas citas (7 días)</div>
      <div id="lista-prox"></div>
    </div>

    <div class="pane" id="p-cal">
      <div class="cal-header"><h2 id="cal-titulo"></h2><div class="cal-nav"><button onclick="calNav(-1)">‹</button><button onclick="calNav(1)">›</button></div></div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="sec-title" id="cal-sel-titulo">Todos los eventos del mes</div>
      <div id="cal-events"></div>
    </div>

    <div class="pane" id="p-clientes">
      <div id="vista-lista-clientes">
        <input type="search" id="busca-cliente" placeholder="Buscar cliente..." style="margin-bottom:12px" oninput="renderClientes()">
        <div class="filter-row">
          <button class="filt active" onclick="filtCl('todos',this)">Todos</button>
          <button class="filt" onclick="filtCl('debe',this)">Con saldo</button>
          <button class="filt" onclick="filtCl('pagado',this)">Pagados</button>
        </div>
        <div id="lista-clientes"></div>
      </div>
      <div id="vista-perfil" style="display:none"></div>
    </div>

    <div class="pane" id="p-nuevo">
      <div class="tipo-sel">
        <button class="tipo-btn sel" onclick="selTipo('cita',this)">📅 Cita</button>
        <button class="tipo-btn" onclick="selTipo('pedido',this)">📦 Pedido</button>
      </div>
      <div class="form-section"><label>Nombre del cliente</label><input type="text" id="f-nom" placeholder="Nombre completo" list="clientes-list"><datalist id="clientes-list"></datalist></div>
      <div class="row2">
        <div class="form-section"><label>Teléfono</label><input type="tel" id="f-tel" placeholder="+56 9 ..."></div>
        <div class="form-section"><label>Dirección</label><input type="text" id="f-dir" placeholder="Calle y número"></div>
      </div>
      <div id="bloque-cita">
        <div style="height:1px;background:var(--border);margin:4px 0 14px"></div>
        <div class="row2"><div class="form-section"><label>Fecha cita</label><input type="date" id="f-fcita"></div><div class="form-section"><label>Hora</label><input type="time" id="f-hcita" value="10:00"></div></div>
        <div class="form-section"><label>Lugar</label><input type="text" id="f-lcita" placeholder="Taller, domicilio..."></div>
        <div class="form-section"><label>Qué quiere el cliente</label><textarea id="f-qcita" placeholder="Cocina, clóset, medidas, colores, referencias..."></textarea></div>
        <div class="row2"><div class="form-section"><label>Precio cotizado ($)</label><input type="number" id="f-pcita" placeholder="0"></div><div class="form-section"><label>Tipo de piedra</label><input type="text" id="f-piedra-c" placeholder="Granito, mármol..."></div></div>
        <div class="form-section"><label>Notas</label><textarea id="f-ncita" rows="2" placeholder="Lo que no debes olvidar..."></textarea></div>
      </div>
      <div id="bloque-pedido" style="display:none">
        <div style="height:1px;background:var(--border);margin:4px 0 14px"></div>
        <div class="row2"><div class="form-section"><label>Tipo de piedra</label><select id="f-piedra"><option value="">Sin piedra</option><option>Granito</option><option>Mármol</option><option>Silestone</option><option>Posformado</option><option>Por definir</option></select></div><div class="form-section"><label>Color melamina</label><input type="text" id="f-melamina" placeholder="Ej: Grafito, Blanco..."></div></div>
      <div class="form-section"><label>Extras incluidos</label>
  <div class="check-grid" id="extras-grid">
    <div class="chk extra-btn" data-extra="enchufe" onclick="toggleExtra(this)">Enchufe</div>
    <div class="chk extra-btn" data-extra="lavaplatos" onclick="toggleExtra(this)">Lavaplatos</div>
    <div class="chk extra-btn" data-extra="gas" onclick="toggleExtra(this)">Gas</div>
    <div class="chk extra-btn" data-extra="horno" onclick="toggleExtra(this)">Horno micr.</div>
    <div class="chk extra-btn" data-extra="agua" onclick="toggleExtra(this)">Agua</div>
    <div class="chk extra-btn" data-extra="campana" onclick="toggleExtra(this)">Campana</div>
    <div class="chk extra-btn" data-extra="piedra" onclick="toggleExtra(this)">Piedra</div>
    <div class="chk extra-btn" data-extra="copero" onclick="toggleExtra(this)">Copero</div>
    <div class="chk extra-btn" data-extra="post" onclick="toggleExtra(this)">Post</div>
    <div class="chk extra-btn" data-extra="peninsula" onclick="toggleExtra(this)">Península</div>
  </div>
  <style>
    .extra-btn{transition:all .15s;user-select:none}
    .extra-btn.sel{background:var(--text);color:#fff;border-color:var(--text)}
    .extra-btn.sel{background:var(--text)!important;color:#fff!important;border-color:var(--text)!important}
    .extra-btn.sel::after{content:' ✓';font-size:11px;margin-left:4px}
  </style>
</div>
        <div class="form-section"><label>Croquis / boceto</label><textarea id="f-croquis" rows="4" placeholder="Ej: Cocina en L, 3m pared norte..."></textarea></div>
        <div class="row2"><div class="form-section"><label>Fecha de venta</label><input type="date" id="f-fventa"></div><div class="form-section"><label>Propuesta entrega</label><input type="date" id="f-fentrega"></div></div>
        <div class="form-section"><label>Hora de entrega</label><input type="time" id="f-hentrega" value="10:00"></div>
        <div class="form-section"><label>Dirección de entrega</label><input type="text" id="f-dir2" placeholder="Dejar vacío si es la misma"></div>
        <div style="height:1px;background:var(--border);margin:4px 0 14px"></div>
        <div class="form-section"><label>Total ($)</label><input type="number" id="f-total" placeholder="0"></div>
        <div class="row2"><div class="form-section"><label>Abono 1 ($)</label><input type="number" id="f-ab1" placeholder="0"></div><div class="form-section"><label>Abono 2 ($)</label><input type="number" id="f-ab2" placeholder="0"></div></div>
        <div class="form-section"><label>Forma de pago</label><select id="f-pago"><option value="">Seleccionar...</option><option>Efectivo</option><option>Transferencia</option><option>Débito</option><option>Crédito</option><option>Mixto</option></select></div>
        <div class="form-section"><label>Notas del pedido</label><textarea id="f-nped" rows="2" placeholder="Instalación, piso, acceso especial..."></textarea></div>
      </div>
      <button class="btn-main" onclick="guardar()" style="margin-top:8px">Guardar</button>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="go('hoy')" id="n-hoy"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Hoy</button>

    <button class="nav-btn" onclick="go('clientes')" id="n-clientes"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clientes</button>

function setSyncStatus(s) {
  const d = document.getElementById('sync-dot');
  if(!d) return;

async function cargarDatos() {
  const { data, error } = await supabase.from('registros').select('*').order('id', { ascending: true });

  _cache = data.map(r => ({ id: String(r.id), ...r.datos }));

async function saveData(docId, datos) {
  setSyncStatus('syncing');
  if (docId) {
    const { error } = await supabase.from('registros').update({ datos }).eq('id', Number(docId));
    if (error) throw error;
  } else {
    const { data, error } = await supabase.from('registros').insert({ datos }).select('id').single();
    if (error) throw error;
    docId = String(data.id);
  }
  await cargarDatos();
  setSyncStatus('ok');

}

async function deleteData(docId) {

// ============ HOY ============
function renderHoy(){
  const data=getData(), h=hoy();
  const citas=data.filter(x=>x.tipo==='cita'&&x.fecha===h&&x.estado!=='cancelado');
  const entregas=data.filter(x=>x.tipo==='pedido'&&x.fentrega===h&&x.estado==='pendiente');
  const mesActual=mesStr(new Date());
  const delMes=data.filter(x=>x.tipo==='pedido'&&(x.fventa||'').startsWith(mesActual));
  const genMes=delMes.reduce((a,x)=>a+(Number(x.total)||0),0);
  const porCobrar=data.filter(x=>x.tipo==='pedido'&&x.estado==='pendiente').reduce((a,x)=>a+saldo(x),0);

  document.getElementById('s-citas').textContent=citas.length;
  document.getElementById('s-ent').textContent=entregas.length;
  document.getElementById('s-mes').textContent='$'+Math.round(genMes).toLocaleString('es-CL');
  document.getElementById('s-cobrar').textContent='$'+Math.round(porCobrar).toLocaleString('es-CL');

  const hora=new Date().getHours();
  const deHoy=[...citas,...entregas].sort((a,b)=>((a.hora||a.hentrega||'')>(b.hora||b.hentrega||''))?1:-1);
  const av=document.getElementById('aviso-hoy');
  if(hora>=7&&hora<=10&&deHoy.length>0){
    document.getElementById('aviso-txt').textContent=deHoy.map(x=>x.tipo==='cita'?`• Cita: ${x.nombre}${x.hora?' a las '+x.hora:''}${x.lcita?' — '+x.lcita:''}`:`• Entrega: ${x.nombre}${x.hentrega?' a las '+x.hentrega:''}`).join('\n');
    av.style.display='block';
  } else av.style.display='none';

  document.getElementById('lista-hoy').innerHTML=deHoy.length===0?'<div class="empty"><div class="empty-icon">🌙</div><p>Sin actividad para hoy</p></div>':deHoy.map(miniCard).join('');

  const desde=new Date(); desde.setDate(desde.getDate()+1);
  const hasta=new Date(); hasta.setDate(hasta.getDate()+7);
  const prox=data.filter(x=>{
    const f=x.tipo==='cita'?x.fecha:x.fentrega;
    if(!f||x.estado==='cancelado'||x.estado==='entregado') return false;
    const fd=new Date(f+'T12:00');
    return fd>=desde&&fd<=hasta;
  }).sort((a,b)=>{const fa=a.tipo==='cita'?a.fecha:a.fentrega;const fb=b.tipo==='cita'?b.fecha:b.fentrega;return fa>fb?1:-1;});
  document.getElementById('lista-prox').innerHTML=prox.length===0?'<div class="empty" style="padding:20px"><p>Sin eventos próximos</p></div>':prox.map(miniCard).join('');
}

  const bc={pendiente:'pend',confirmada:'conf',entregado:'ent',cancelado:'canc'}[x.estado]||'pend';
  const s=saldo(x);
  return`<div class="card-sm" style="cursor:pointer" onclick="abrirPerfil('${normNom(x.nombre)}')">

window.calNav = function(dir){

function renderCal(){
  const data=getData();
  document.getElementById('cal-titulo').textContent=nombreMes(calFecha).replace(/^\w/,c=>c.toUpperCase());
  const y=calFecha.getFullYear(), m=calFecha.getMonth();
  const primer=new Date(y,m,1);
  const ultimo=new Date(y,m+1,0);
  let dias=[];
  let dow=(primer.getDay()+6)%7;
  for(let i=dow-1;i>=0;i--){const d=new Date(y,m,-i); dias.push({fecha:d,otroMes:true});}
  for(let d=1;d<=ultimo.getDate();d++) dias.push({fecha:new Date(y,m,d),otroMes:false});
  while(dias.length%7!==0) dias.push({fecha:new Date(y,m+1,dias.length-ultimo.getDate()-dow+1),otroMes:true});

  const mesActual=mesStr(calFecha);
  const eventosDelMes=data.filter(x=>{const f=x.tipo==='cita'?x.fecha:x.fentrega;return f&&f.startsWith(mesActual)&&x.estado!=='cancelado';});

  const hoyS=hoy();
  const names=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
  let html=names.map(n=>`<div class="cal-day-name">${n}</div>`).join('');
  dias.forEach(({fecha,otroMes})=>{
    const fs=fecha.toISOString().split('T')[0];
    const evs=eventosDelMes.filter(x=>(x.tipo==='cita'?x.fecha:x.fentrega)===fs);
    const tieneCitas=eventosDelMes.filter(x=>x.tipo==='cita'&&x.fecha===fs).length>0;
    const tienePedidos=eventosDelMes.filter(x=>x.tipo==='pedido'&&x.fentrega===fs).length>0;
    const isHoy=fs===hoyS;
    const isSel=fs===calSelDia;
    const cls=['cal-day',otroMes?'other-month':'',isHoy?'today':'',isSel&&!isHoy?'selected':'',evs.length?'has-event':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}" onclick="selDiaCal('${fs}')">
      ${fecha.getDate()}
      ${tieneCitas&&!isHoy?`<div class="dot" style="background:var(--red)"></div>`:''}
      ${tienePedidos&&!tieneCitas&&!isHoy?`<div class="dot" style="background:var(--blue)"></div>`:''}
      ${(tieneCitas||tienePedidos)&&isHoy?`<div class="dot" style="background:#fff"></div>`:''}
    </div>`;
  });
  document.getElementById('cal-grid').innerHTML=html;

  if(calSelDia){
    const evsDia=eventosDelMes.filter(x=>(x.tipo==='cita'?x.fecha:x.fentrega)===calSelDia);
    document.getElementById('cal-sel-titulo').textContent=`Eventos del ${fmt(calSelDia)}`;
    document.getElementById('cal-events').innerHTML=evsDia.length===0?'<div class="empty" style="padding:20px"><p>Sin eventos ese día</p></div>':evsDia.map(miniCard).join('');
  } else {
    document.getElementById('cal-sel-titulo').textContent='Todos los eventos del mes';
    const todos=[...eventosDelMes].sort((a,b)=>{const fa=a.tipo==='cita'?a.fecha:a.fentrega;const fb=b.tipo==='cita'?b.fecha:b.fentrega;return fa>fb?1:-1;});
    document.getElementById('cal-events').innerHTML=todos.length===0?'<div class="empty" style="padding:20px"><p>Sin eventos este mes</p></div>':todos.map(miniCard).join('');
  }
}

function normNom(n){return n.trim().toLowerCase()}

function getClientes(){
  const data=getData();
  const map={};
  data.forEach(x=>{
    const k=normNom(x.nombre);
    if(!map[k]) map[k]={nombre:x.nombre,tel:x.tel||x.telefono||'',dir:x.dir||'',registros:[]};
    map[k].registros.push(x);
  });
  return Object.values(map);
}

function renderClientes(){
  if(perfilActivo){renderPerfil(perfilActivo);return;}
  document.getElementById('vista-lista-clientes').style.display='block';
  document.getElementById('vista-perfil').style.display='none';
  const busca=(document.getElementById('busca-cliente').value||'').toLowerCase();
  let clientes=getClientes().filter(c=>c.nombre.toLowerCase().includes(busca));
  if(filtroClientes==='debe') clientes=clientes.filter(c=>c.registros.some(x=>x.tipo==='pedido'&&saldo(x)>0&&x.estado!=='cancelado'));
  if(filtroClientes==='pagado') clientes=clientes.filter(c=>c.registros.some(x=>x.tipo==='pedido'&&saldo(x)<=0&&x.estado!=='cancelado'));
  clientes.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));

  if(clientes.length===0){
    document.getElementById('lista-clientes').innerHTML='<div class="empty"><div class="empty-icon">👤</div><p>Sin clientes registrados</p></div>';
    return;
  }

  document.getElementById('lista-clientes').innerHTML=clientes.map(c=>{
    const pedidos=c.registros.filter(x=>x.tipo==='pedido'&&x.estado!=='cancelado');
    const totalFacturado=pedidos.reduce((a,x)=>a+(Number(x.total)||0),0);
    const totalSaldo=pedidos.reduce((a,x)=>a+saldo(x),0);
    const pagoStatus=totalSaldo<=0&&totalFacturado>0?'pago-ok':totalSaldo>0?'pago-no':'';
    const nCitas=c.registros.filter(x=>x.tipo==='cita').length;

    </div>`;
  }).join('');
}

      </div>
      <div class="info-row"><span class="info-label">Total facturado</span><span class="info-val" style="font-weight:700;font-size:15px;color:var(--blue)">${fmtM(totalFacturado)}</span></div>
      <div class="info-row"><span class="info-label">Total abonado</span><span class="info-val" style="color:var(--amber);font-weight:600">${fmtM(totalAbonado)}</span></div>
      <div class="info-row" style="border-bottom:none"><span class="info-label">Saldo pendiente</span>
        <span class="info-val" style="font-weight:700;font-size:15px;color:${totalSaldo<=0?'var(--green)':'var(--red)'}">
          ${totalSaldo<=0?'✓ Pagado al día':fmtM(totalSaldo)}
        </span>
      </div>
    </div>`;
  }

  html+=`<div class="sec-title">📋 Historial (${c.registros.length})</div>`;
  html+=sorted.map(x=>{
    const esCita=x.tipo==='cita';
    const fecha=esCita?x.fecha:x.fentrega||x.fventa||'';
    const lbl={pendiente:'Pendiente',confirmada:'Confirmada',entregado:'Entregado',cancelado:'Cancelado'};
    const bc={pendiente:'pend',confirmada:'conf',entregado:'ent',cancelado:'canc'}[x.estado]||'pend';
    const s=saldo(x);
    return`<div class="card" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:16px">${esCita?'📅':'📦'}</span>
          <div>
            <div style="font-size:13px;font-weight:600">${esCita?'Cita':'Pedido'}</div>
            <div style="font-size:11px;color:var(--text3)">${fmt(fecha)||'Sin fecha'}${(esCita?x.hora:x.hentrega)?' · '+(esCita?x.hora:x.hentrega)+'h':''}</div>
          </div>
        </div>
        <span class="badge ${bc}">${lbl[x.estado]}</span>
      </div>
      ${x.tipo==='pedido'&&x.total?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px"><span class="money-pill mp-total">${fmtM(x.total)}</span>${x.ab1?`<span class="money-pill mp-ab">Ab.1 ${fmtM(x.ab1)}</span>`:''}${x.ab2?`<span class="money-pill mp-ab">Ab.2 ${fmtM(x.ab2)}</span>`:''}<span class="money-pill ${s<=0?'mp-ok':'mp-saldo'}">${s<=0?'Pagado':'Saldo '+fmtM(s)}</span></div>`:''}
      ${x.tipo==='cita'&&x.pcita?`<span class="money-pill mp-total" style="margin-bottom:6px;display:inline-block">Cotiz. ${fmtM(x.pcita)}</span>`:''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">
        <button class="btn-outline" style="font-size:11px;padding:4px 8px" onclick="abrirEditar('${x.id}')">✏️ Editar</button>
        ${x.estado==='pendiente'&&esCita?`<button class="btn-green" style="font-size:11px;padding:4px 8px" onclick="cambiarEstado('${x.id}','confirmada')">✓ Confirmar</button>`:''}
        ${x.estado!=='cancelado'&&x.estado!=='entregado'?`<button class="btn-red" style="font-size:11px;padding:4px 8px" onclick="cambiarEstado('${x.id}','cancelado')">Cancelar</button>`:''}
      </div>
    </div>`;
  }).join('');
  if(c.registros.length===0) html+='<div class="empty"><p>Sin registros aún</p></div>';
  document.getElementById('vista-perfil').innerHTML=html;
  document.getElementById('vista-perfil').scrollTop=0;
}

// ============ PDF ============
window.descargarPDF = function(k){
  const clientes=getClientes();
  const c=clientes.find(x=>normNom(x.nombre)===k);
  if(!c) return;
  const pedidos=c.registros.filter(x=>x.tipo==='pedido'&&x.estado!=='cancelado');
  const totalFacturado=pedidos.reduce((a,x)=>a+(Number(x.total)||0),0);
  const totalAb1=pedidos.reduce((a,x)=>a+(Number(x.ab1)||0),0);
  const totalAb2=pedidos.reduce((a,x)=>a+(Number(x.ab2)||0),0);
  const totalSaldo=pedidos.reduce((a,x)=>a+saldo(x),0);
  const el=document.getElementById('pdf-preview');
  const fechaHoy=new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});
  let pedHtml='';
  pedidos.forEach((x,i)=>{
    const extras=['enchufe','lavaplatos','gas','horno','agua','campana','piedra','copero','post','peninsula'].filter(ek=>x['x_'+ek]).join(', ');
    pedHtml+=`<tr><td>${i+1}</td><td>${fmt(x.fventa)||'—'}</td><td>${fmt(x.fentrega)||'—'}</td><td>${x.piedra||'—'}</td><td>${x.melamina||'—'}</td><td>${extras||'—'}</td><td style="text-align:right">${fmtM(x.total)||'—'}</td><td style="text-align:right">${fmtM(x.ab1)||'—'}</td><td style="text-align:right">${fmtM(x.ab2)||'—'}</td><td style="text-align:right;font-weight:600;color:${saldo(x)<=0?'#1a6b4a':'#c0392b'}">${saldo(x)<=0?'Pagado':fmtM(saldo(x))}</td></tr>`;
  });
  el.innerHTML=`<div class="pdf-logo"><span>Fig</span>Anzi.</div><div style="font-size:11px;color:#999;margin-bottom:16px">Penco, Biobío · ${fechaHoy}</div><h2 style="font-size:16px;margin-bottom:6px">Ficha: ${c.nombre}</h2>
  ${pedidos.length>0?`<div class="pdf-section"><h3>Pedidos</h3><table><thead><tr><th>#</th><th>F. Venta</th><th>F. Entrega</th><th>Piedra</th><th>Melamina</th><th>Extras</th><th>Total</th><th>Ab1</th><th>Ab2</th><th>Saldo</th></tr></thead><tbody>${pedHtml}</tbody><tfoot><tr class="total-row"><td colspan="6">TOTALES</td><td>${fmtM(totalFacturado)}</td><td>${fmtM(totalAb1)}</td><td>${fmtM(totalAb2)}</td><td style="color:${totalSaldo<=0?'#1a6b4a':'#c0392b'}">${totalSaldo<=0?'PAGADO':fmtM(totalSaldo)}</td></tr></tfoot></table></div>`:''}
  <div class="disclaimer">Documento interno FigAnzi. No representa factura formal.</div>`;
  el.style.display='block';
  window.print();
  setTimeout(()=>{el.style.display='none';},1000);
}

// ============ EDITAR Y GUARDAR ============
window.abrirEditar = function(id){
  const x=getData().find(d=>d.id===id);
  if(!x) return;
  document.getElementById('modal-title').textContent=x.tipo==='cita'?'Editar cita':'Editar pedido';
  let html=`<div class="form-section"><label>Nombre</label><input type="text" id="e-nom" value="${x.nombre||''}"></div><div class="form-section"><label>Estado</label><select id="e-estado"><option value="pendiente" ${x.estado==='pendiente'?'selected':''}>Pendiente</option><option value="confirmada" ${x.estado==='confirmada'?'selected':''}>Confirmada</option><option value="entregado" ${x.estado==='entregado'?'selected':''}>Entregado</option><option value="cancelado" ${x.estado==='cancelado'?'selected':''}>Cancelado</option></select></div><div class="btn-row"><button class="btn-main" onclick="guardarEdicion('${id}')">Guardar</button><button class="btn-outline" onclick="cerrarModal()">Cancelar</button></div>`;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-editar').classList.add('open');
}

window.guardarEdicion = async function(id){
  const datos={nombre: document.getElementById('e-nom').value.trim(), estado: document.getElementById('e-estado').value};
  try { await saveData(id, datos); cerrarModal(); } catch(e) { alert('Error al guardar.'); }
}

window.cerrarModal = function(){document.getElementById('modal-editar').classList.remove('open');}
document.getElementById('modal-editar').addEventListener('click',function(e){if(e.target===this) cerrarModal();});

function actualizarDatalist(){
  const clientes=getClientes();
  document.getElementById('clientes-list').innerHTML=clientes.map(c=>`<option value="${c.nombre}">`).join('');
}

window.guardar = async function(){
  const nom=document.getElementById('f-nom').value.trim();
  if(!nom){alert('Ingresa el nombre del cliente.');return;}
  const base={nombre: nom, tel: document.getElementById('f-tel').value.trim(), dir: document.getElementById('f-dir').value.trim(), tipo: tipoActual, estado: 'pendiente'};
  if(tipoActual==='cita'){
    const fecha=document.getElementById('f-fcita').value;
    if(!fecha){alert('Selecciona la fecha de la cita.');return;}
    Object.assign(base,{fecha, hora: document.getElementById('f-hcita').value, lcita: document.getElementById('f-lcita').value.trim(), qcita: document.getElementById('f-qcita').value.trim(), pcita: document.getElementById('f-pcita').value||null, piedraC: document.getElementById('f-piedra-c').value.trim(), ncita: document.getElementById('f-ncita').value.trim()});
  } else {
    const fe=document.getElementById('f-fentrega').value;
    if(!fe){alert('Selecciona la propuesta de entrega.');return;}
    const extras={};
    ['enchufe','lavaplatos','gas','horno','agua','campana','piedra','copero','post','peninsula'].forEach(ek=>{extras['x_'+ek]=document.getElementById('x-'+ek).checked;});
    Object.assign(base,{fventa: document.getElementById('f-fventa').value, fentrega: fe, hentrega: document.getElementById('f-hentrega').value, dir2: document.getElementById('f-dir2').value.trim(), piedra: document.getElementById('f-piedra').value, melamina: document.getElementById('f-melamina').value.trim(), croquis: document.getElementById('f-croquis').value.trim(), total: document.getElementById('f-total').value||null, ab1: document.getElementById('f-ab1').value||null, ab2: document.getElementById('f-ab2').value||null, formaPago: document.getElementById('f-pago').value, nped: document.getElementById('f-nped').value.trim(), ...extras});
  }
  try {
    await saveData(null, base);
    document.querySelectorAll('#p-nuevo input:not([type=checkbox])').forEach(el=>{if(el.type==='time') el.value='10:00';else el.value='';});
    document.querySelectorAll('#p-nuevo textarea').forEach(el=>el.value='');
    document.querySelectorAll('#p-nuevo select').forEach(el=>el.value='');
    document.querySelectorAll('#p-nuevo input[type=checkbox]').forEach(el=>el.checked=false);
    go('hoy');
  } catch(e) { alert('Error al guardar: ' + e.message); }
}
